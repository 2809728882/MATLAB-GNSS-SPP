name: MATLAB validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
      - name: Run regression tests and offline examples
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('code'); mkdir('artifacts'); runner=matlab.unittest.TestRunner.withTextOutput; runner.addPlugin(matlab.unittest.plugins.XMLPlugin.producingJUnitFormat('artifacts/test-results.xml')); results=runner.run(testsuite('tests')); assertSuccess(results); runSPP(struct('maxEpochs',30,'outputDir','artifacts/broadcast')); runSPP(struct('maxEpochs',30,'ephemerisMode','sp3','outputDir','artifacts/sp3'));
      - name: Upload test reports and real sample results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-spp-validation
          path: artifacts/
